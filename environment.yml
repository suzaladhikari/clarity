name: streamlit-env

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  - pip:
      - streamlit
      - pandas==2.2.3
      - numpy==1.26.4
      - pyarrow==18.1.0
      - scikit-learn==1.8.0
      - joblib==1.4.2
      - xgboost==3.2.0
      - arch==7.2.0
      - matplotlib==3.9.4
      - seaborn
      - plotly
      - requests